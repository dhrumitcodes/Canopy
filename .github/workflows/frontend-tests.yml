name: Frontend checks

on:
  pull_request:
    paths:
      - "societyweb/**"
      - ".github/workflows/frontend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "societyweb/**"
      - ".github/workflows/frontend-tests.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: societyweb/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: societyweb
      - name: Lint
        run: npm run lint
        working-directory: societyweb
      - name: Build
        run: npm run build
        working-directory: societyweb
