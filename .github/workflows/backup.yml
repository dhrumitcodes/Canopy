name: Database backup

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate backup secrets
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing GitHub Actions secret BACKUP_DATABASE_URL. Add the hosted PostgreSQL connection URL in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Missing GitHub Actions secret BACKUP_PASSPHRASE. Add a strong backup encryption passphrase in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Dump the database
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          umask 077
          docker run --rm -e DATABASE_URL postgres:17-alpine \
            sh -c 'pg_dump "$DATABASE_URL" --no-owner --format=custom' > backup.dump
          test -s backup.dump
          docker run --rm -v "$PWD:/backup:ro" postgres:17-alpine \
            pg_restore --list /backup/backup.dump > backup.contents.txt
          test -s backup.contents.txt

      - name: Encrypt and verify the backup
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o backup.dump.gpg backup.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --decrypt --output backup-verified.dump backup.dump.gpg
          docker run --rm -v "$PWD:/backup:ro" postgres:17-alpine \
            pg_restore --list /backup/backup-verified.dump > /dev/null
          rm -f backup.dump backup-verified.dump backup.contents.txt

      - name: Keep the encrypted backup for 14 days
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: backup.dump.gpg
          if-no-files-found: error
          retention-days: 14
