name: Database backup

on:
  schedule:
    - cron: "0 21 * * *"   # every day at 21:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Validate backup secrets
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing GitHub Actions secret BACKUP_DATABASE_URL. Add the hosted PostgreSQL connection URL in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Missing GitHub Actions secret BACKUP_PASSPHRASE. Add a strong backup encryption passphrase in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Dump the database
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          docker run --rm -e DATABASE_URL postgres:17-alpine \
            sh -c 'pg_dump "$DATABASE_URL" --no-owner --format=custom' > backup.dump

      - name: Encrypt the dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o backup.dump.gpg backup.dump
          rm backup.dump

      - name: Keep the encrypted backup for 14 days
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: backup.dump.gpg
          retention-days: 14